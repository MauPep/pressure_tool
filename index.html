<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manometro BLE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 20px 16px;
      margin: 12px auto;
      max-width: 440px;
    }
    h1 {
      margin: 0 0 12px;
      color: #8b949e;
      font-size: 15px;
      font-weight: 600;
    }
    #hPa { font-size: 64px; font-weight: 700; line-height: 1.1; }
    #hPaUnit { color: #8b949e; font-size: 18px; }
    .sub-grid {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #21262d;
      color: #8b949e;
      font-size: 14px;
    }
    canvas {
      width: 100%;
      height: 220px;
      display: block;
      margin-top: 16px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }
    button {
      background: #238636;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      min-width: 0;
    }
    .chart-options {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      color: #8b949e;
      font-size: 13px;
    }
    select {
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 7px 10px;
      font: inherit;
    }
    button:disabled {
      background: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }
    button.secondary {
      background: #1f6feb;
    }
    button.warning {
      background: #9e6a03;
    }
    button.paused {
      background: #238636;
    }
    #status {
      color: #8b949e;
      font-size: 13px;
      margin-top: 14px;
    }
    @media (orientation: landscape) and (max-height: 600px) {
      body { padding: 6px; }
      .card {
        display: grid;
        grid-template-columns: minmax(180px, 0.8fr) minmax(0, 2fr);
        grid-template-areas:
          "reading chart"
          "options chart"
          "buttons chart"
          "export chart"
          "status chart";
        gap: 0 16px;
        max-width: none;
        min-height: calc(100dvh - 12px);
        margin: 0;
        padding: 10px 14px;
      }
      .reading { grid-area: reading; align-self: center; }
      .chart-options { grid-area: options; margin-top: 4px; }
      #chart { grid-area: chart; height: calc(100dvh - 62px); min-height: 160px; margin: 0; align-self: center; }
      .btn-group { grid-area: buttons; margin-top: 8px; }
      .btn-group.export { grid-area: export; margin-top: 6px; }
      #status { grid-area: status; margin-top: 6px; align-self: start; }
      #hPa { font-size: clamp(42px, 10vh, 58px); }
      .sub-grid { font-size: 12px; }
      button { padding: 8px 6px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="reading">
      <h1>Manometro BLE</h1>
      <div id="hPa">--</div>
      <div id="hPaUnit">hPa</div>

      <div class="sub-grid">
        <div id="atm">-- atm</div>
        <div id="mmHg">-- mmHg</div>
        <div id="psi">-- psi</div>
      </div>
    </div>

    <canvas id="chart"></canvas>

    <label class="chart-options" for="timeframe">
      Intervallo
      <select id="timeframe">
        <option value="30000">30 secondi</option>
        <option value="60000">1 minuto</option>
        <option value="300000" selected>5 minuti</option>
        <option value="900000">15 minuti</option>
      </select>
    </label>

    <div class="btn-group">
      <button id="btnConnect" class="secondary" onclick="connectBLE()">Connetti</button>
      <button id="btnPause" class="warning" onclick="togglePause()" disabled>Pausa</button>
      <button id="btnZero" onclick="sendZero()" disabled>Azzera</button>
    </div>
    <div class="btn-group export">
      <button id="btnSave" onclick="saveScreenshot()">Salva screenshot</button>
    </div>

    <div id="status">Pronto per la connessione</div>
  </div>

  <script>
    const SERVICE_UUID       = '19b10000-e8f2-537e-4f6c-d104768a1214';
    const CHAR_PRESSURE_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';
    const CHAR_ZERO_UUID     = '19b10002-e8f2-537e-4f6c-d104768a1214';

    let bleDevice = null;
    let zeroCharacteristic = null;
    let isPaused = false;
    let hist = [];
    const HISTORY_MAX = 10000;
    const chart = document.getElementById('chart');

    document.getElementById('timeframe').addEventListener('change', draw);
    window.addEventListener('resize', draw);

    async function connectBLE() {
      if (!navigator.bluetooth) {
        setStatus('Web Bluetooth non supportato su questo browser. Usa Chrome.');
        return;
      }

      try {
        setStatus('Ricerca dispositivo...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ManometroBLE' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        setStatus('Connessione in corso...');
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        const pressureChar = await service.getCharacteristic(CHAR_PRESSURE_UUID);
        zeroCharacteristic = await service.getCharacteristic(CHAR_ZERO_UUID);

        await pressureChar.startNotifications();
        pressureChar.addEventListener('characteristicvaluechanged', handlePressureData);

        document.getElementById('btnConnect').textContent = 'Connesso';
        document.getElementById('btnConnect').disabled = true;
        document.getElementById('btnPause').disabled = false;
        document.getElementById('btnZero').disabled = false;
        setStatus('Connesso a ManometroBLE');
      } catch (error) {
        console.error(error);
        setStatus('Connessione annullata o fallita');
      }
    }

    function onDisconnected() {
      document.getElementById('btnConnect').textContent = 'Connetti';
      document.getElementById('btnConnect').disabled = false;
      document.getElementById('btnPause').disabled = true;
      document.getElementById('btnPause').textContent = 'Pausa';
      document.getElementById('btnPause').className = 'warning';
      document.getElementById('btnZero').disabled = true;
      isPaused = false;
      setStatus('Dispositivo disconnesso');
    }

    function togglePause() {
      isPaused = !isPaused;
      const btn = document.getElementById('btnPause');
      if (isPaused) {
        btn.textContent = 'Riprendi';
        btn.className = 'paused';
        setStatus('Flusso in pausa (dati congelati)');
      } else {
        btn.textContent = 'Pausa';
        btn.className = 'warning';
        setStatus('Flusso in esecuzione');
      }
    }

    function handlePressureData(event) {
      // Se siamo in pausa, scartiamo l'aggiornamento grafico/numerico
      if (isPaused) return;

      const hPa = event.target.value.getFloat32(0, true);

      document.getElementById('hPa').textContent = hPa.toFixed(1);
      document.getElementById('atm').textContent = (hPa / 1013.25).toFixed(4) + ' atm';
      document.getElementById('mmHg').textContent = (hPa * 0.750062).toFixed(1) + ' mmHg';
      document.getElementById('psi').textContent = (hPa * 0.0145038).toFixed(2) + ' psi';

      hist.push({ value: hPa, time: Date.now() });
      if (hist.length > HISTORY_MAX) hist.shift();
      draw();
    }

    async function sendZero() {
      if (!zeroCharacteristic) return;
      try {
        await zeroCharacteristic.writeValue(new Uint8Array([1]));
        hist = [];
        draw();
        setStatus('Zero impostato');
      } catch (e) {
        setStatus('Errore durante l\'azzeramento');
      }
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function draw() {
      const ctx = chart.getContext('2d');
      const width = chart.clientWidth;
      const height = chart.clientHeight;
      if (!width || !height) return;
      const pixelRatio = window.devicePixelRatio || 1;
      chart.width = Math.round(width * pixelRatio);
      chart.height = Math.round(height * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const duration = Number(document.getElementById('timeframe').value);
      const endTime = Date.now();
      const startTime = endTime - duration;
      const points = hist.filter(point => point.time >= startTime);
      const left = 42, right = 8, top = 14, bottom = 24;
      const plotWidth = width - left - right;
      const plotHeight = height - top - bottom;
      if (plotWidth <= 0 || plotHeight <= 0) return;

      let min = points.length ? Math.min(...points.map(point => point.value)) : 0;
      let max = points.length ? Math.max(...points.map(point => point.value)) : 1;
      if (max - min < 1e-6) { min -= 0.5; max += 0.5; }
      const padding = (max - min) * 0.08;
      min -= padding;
      max += padding;
      const rawStep = (max - min) / Math.max(2, Math.floor(plotHeight / 30));
      const magnitude = 10 ** Math.floor(Math.log10(rawStep));
      const fraction = rawStep / magnitude;
      const step = (fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10) * magnitude;
      const firstTick = Math.ceil(min / step) * step;

      ctx.font = '11px system-ui';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#8b949e';
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1;
      for (let tick = firstTick; tick <= max; tick += step) {
        const y = top + (max - tick) / (max - min) * plotHeight;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(width - right, y);
        ctx.stroke();
        ctx.fillText(tick.toFixed(step < 1 ? Math.min(6, Math.ceil(-Math.log10(step))) : 0), left - 6, y);
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#5c7085';
      ctx.fillText('hPa', 4, 2);
      ctx.textAlign = 'center';
      ctx.fillText(formatTime(startTime), left, height - 18);
      ctx.fillText(formatTime(endTime), width - right, height - 18);

      if (points.length < 2) return;
      ctx.beginPath();
      points.forEach((point, index) => {
        const x = left + (point.time - startTime) / duration * plotWidth;
        const y = top + (max - point.value) / (max - min) * plotHeight;
        index ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.strokeStyle = '#58a6ff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function saveScreenshot() {
      const source = chart;
      const output = document.createElement('canvas');
      output.width = 1200;
      const graphHeight = Math.round(source.height * (output.width - 80) / source.width);
      output.height = 210 + graphHeight;
      const ctx = output.getContext('2d');
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, output.width, output.height);
      ctx.fillStyle = '#e6edf3';
      ctx.font = 'bold 34px system-ui';
      ctx.fillText('Manometro BLE', 40, 54);
      ctx.font = '26px system-ui';
      ctx.fillStyle = '#8b949e';
      ctx.fillText(
        `${document.getElementById('hPa').textContent} hPa  |  ${document.getElementById('atm').textContent}  |  ${document.getElementById('mmHg').textContent}  |  ${document.getElementById('psi').textContent}`,
        40, 105
      );
      ctx.font = '20px system-ui';
      ctx.fillText(`Intervallo: ${document.getElementById('timeframe').selectedOptions[0].text}  |  ${new Date().toLocaleString('it-IT')}`, 40, 148);
      ctx.drawImage(source, 40, 180, output.width - 80, graphHeight);
      output.toBlob(blob => {
        if (!blob) {
          setStatus('Impossibile creare lo screenshot');
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `manometro-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    }
  </script>
</body>
</html>
